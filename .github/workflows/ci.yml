name: CI

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/phase1-sqlite-reliability

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "hydroguard-backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r hydroguard-backend/requirements.txt

      - name: Generate isolated offline test credentials
        run: |
          python -c '
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          import json, os

          key = rsa.generate_private_key(public_exponent=65537, key_size=1024)
          pem = key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          ).decode("utf-8")

          dummy = {
              "type": "service_account",
              "project_id": "hydroguard-4a606",
              "private_key_id": "ci-test-key-id",
              "private_key": pem,
              "client_email": "ci-test@hydroguard-4a606.iam.gserviceaccount.com",
              "client_id": "123456789012345678901",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
          }
          os.makedirs("/tmp/hydroguard", exist_ok=True)
          with open("/tmp/hydroguard/ci-firebase-credentials.json", "w") as f:
              json.dump(dummy, f)
          '

      - name: Run pytest test suite
        working-directory: hydroguard-backend
        env:
          HYDROGUARD_ENVIRONMENT: "test"
          HYDROGUARD_FIREBASE_PROJECT_ID: "hydroguard-4a606"
          GOOGLE_APPLICATION_CREDENTIALS: "/tmp/hydroguard/ci-firebase-credentials.json"
        run: python -m pytest -q

  android:
    name: Android Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
