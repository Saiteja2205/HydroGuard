# HydroGuard — Render Blueprint Specification.
#
# Canonical Source of Truth for Render Infrastructure as Code.
# Provisions a managed PostgreSQL database and a CPU-only Docker web service.
# Render automatically detects this file at the repository root on "New > Blueprint".
#
# IMPORTANT — Secrets marked `sync: false` must be populated in the Render
# dashboard. The application fails closed at boot if required secrets are missing.
# No secrets, tokens, or private credentials are stored in this file.

databases:
  - name: hydroguard-postgres
    databaseName: hydroguard
    user: hydroguard
    region: oregon
    # Production Persistence & Backup Policy Note:
    # Render's `plan: free` PostgreSQL expires and is permanently deleted after 30 days
    # without automated backup or recovery capabilities.
    # For durable production persistence with automated continuous point-in-time
    # recovery (PITR) and retention, change to `plan: starter` ($7/mo; 0.5 CPU, 1 GB RAM, 10 GB SSD).
    plan: free # Change to `starter` for durable production deployment
    ipAllowList: [] # internal network access only (no public exposure)
    # Note: To run initial migration from a local workstation, temporarily whitelist
    # your local public IP in Render Dashboard > Access Control, migrate, then remove.

services:
  - type: web
    name: hydroguard-backend
    runtime: docker
    region: oregon
    rootDir: hydroguard-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # Change to `starter` ($7/mo) to eliminate cold starts and enable preDeployCommand

    # Render injects $PORT; the Dockerfile's CMD reads it.
    healthCheckPath: /api/v1/health

    # Free-tier instances spin down when idle, so the first request after a
    # pause pays a cold start (checkpoint load happens lazily on the first
    # forecast, not at boot, so the cold start is a few seconds rather than
    # tens of seconds).
    autoDeploy: true

    # Pre-Deploy Migration Note:
    # Render's `preDeployCommand` (e.g. `alembic upgrade head`) is only supported
    # on paid compute plans (`plan: starter` or higher). Render rejects `preDeployCommand`
    # on `plan: free`. Initial schema creation is safely handled at boot by
    # `Base.metadata.create_all()` in `app.main:lifespan`, and schema migrations
    # are applied via CLI (`alembic upgrade head`) or the migration utility.
    # If upgrading this web service to `plan: starter`, uncomment:
    # preDeployCommand: alembic upgrade head

    envVars:
      # ---- Database / Persistence ---------------------------------------
      # Render injects the private internal connection string from the database
      # provisioned above. The backend normalizes postgres:// to postgresql+psycopg://
      # and applies connection pooling and pre-ping automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: hydroguard-postgres
          property: connectionString

      # ---- Runtime mode -------------------------------------------------
      # production locks CORS to an empty origin list and disables the
      # development identity bridge. Do not set development here: it enables
      # the X-HydroGuard-Development-* header bypass, which must never be
      # reachable from the public internet.
      - key: HYDROGUARD_ENVIRONMENT
        value: production

      # ---- Firebase (required; app fails closed without it) --------------
      # GOOGLE_APPLICATION_CREDENTIALS must point at a service-account JSON
      # file. Render supplies this as a secret file mounted into the container;
      # set the path below to wherever you mount it (e.g. /etc/secrets/firebase.json).
      - key: HYDROGUARD_FIREBASE_PROJECT_ID
        value: hydroguard-4a606
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false   # path to the mounted secret file, e.g. /etc/secrets/firebase-service-account.json

      # ---- Student registration allowlist --------------------------------
      # Comma-separated, no spaces. A domain that is absent here will NOT
      # auto-provision a student, and an unset value rejects every
      # registration rather than opening it.
      - key: HYDROGUARD_ALLOWED_STUDENT_DOMAINS
        sync: false   # e.g. vrsec.ac.in,your-college.edu.in

      # ---- Sensor ingestion (optional) -----------------------------------
      # Leave unconfigured to keep POST /readings disabled (it fails closed).
      - key: HYDROGUARD_SENSOR_API_KEY
        sync: false

      # ---- ThingSpeak channel (for GET /api/v1/thingspeak/forecast) -------
      # Without a channel id this endpoint returns 503 and says exactly which
      # variable to set. The read API key is only needed for a private channel.
      - key: HYDROGUARD_THINGSPEAK_CHANNEL_ID
        sync: false   # numeric channel id, e.g. 244357
      - key: HYDROGUARD_THINGSPEAK_READ_API_KEY
        sync: false   # optional; only for private channels

      # Optional overrides, each with a safe default in code:
      #   HYDROGUARD_THINGSPEAK_BASE_URL          (default https://api.thingspeak.com)
      #   HYDROGUARD_THINGSPEAK_RESULTS           (default 30, floored at the 30-row model window)
      #   HYDROGUARD_THINGSPEAK_TIMEOUT_SECONDS   (default 10)

      # ---- Logging --------------------------------------------------------
      - key: HYDROGUARD_LOG_LEVEL
        value: INFO
